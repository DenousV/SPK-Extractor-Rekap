<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPK Extractor - Rekap SPK</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#66707c;--bd:#d9dee5;--ac:#1f5fbf;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#95a0ad;--bd:#343b44;--ac:#5b9bff;--acx:#0b1a30}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#95a0ad;--bd:#343b44;--ac:#5b9bff;--acx:#0b1a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 16px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:28px 16px;text-align:center;background:var(--card);cursor:pointer}
#drop.o{border-color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.wrap{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);text-align:left;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:4px 6px;border-bottom:1px solid var(--bd)}
td input{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px}
td input:focus{border-color:var(--ac);outline:none}
td input.m{border-color:#b3261e;background:rgba(179,38,30,.08)}
td button{padding:2px 8px}
.e{padding:16px;color:var(--mu);text-align:center}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mu);font-size:13px}
textarea{width:100%;min-height:160px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace}
.w{color:#b3261e;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>SPK Extractor: Rekap SPK</h1>
<p class="s">Upload SPK (PDF), data langsung jadi baris tabel yang bisa dicopy ke Excel. File diproses di browser.</p>
<div id="drop">Klik atau tarik file SPK (PDF) ke sini<br><small style="color:var(--mu)">Bisa lebih dari satu file</small>
<input id="f" type="file" accept="application/pdf" multiple hidden></div>
<div class="bar"><button id="cpy" class="p">Copy semua baris</button><button id="cph">Copy + header</button><button id="clr">Clear</button></div>
<div class="wrap"><table>
<thead><tr><th>Tanggal SPK</th><th>Nomor Polisi</th><th>Bengkel</th><th>Jumlah Panel</th><th>Total OR</th><th>No Claim</th><th></th></tr></thead>
<tbody id="tb"></tbody></table><div id="emp" class="e">Belum ada data</div></div>
<div id="msg"></div>
<details id="dt" hidden><summary>Teks terbaca dari PDF</summary><textarea id="raw" readonly></textarea></details>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
const $=id=>document.getElementById(id);
const drop=$("drop"),fi=$("f"),tb=$("tb");
drop.onclick=()=>fi.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add("o")};
drop.ondragleave=()=>drop.classList.remove("o");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("o");run(e.dataTransfer.files)};
fi.onchange=()=>run(fi.files);

const MON={january:1,januari:1,february:2,februari:2,march:3,maret:3,april:4,may:5,mei:5,june:6,juni:6,july:7,juli:7,august:8,agustus:8,september:9,october:10,oktober:10,november:11,nopember:11,december:12,desember:12};
const num=s=>(s||"").replace(/[.,]/g,"");
function fmtPlate(p){const m=p.match(/^([A-Z]{1,2})(\d{1,4})([A-Z]{0,3})$/);return m?[m[1],m[2],m[3]].filter(Boolean).join(" "):p}
function parse(text){
  const t=text.replace(/\s+/g," ");
  let tgl="";
  const d=t.match(/Jakarta,\s*(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if(d&&MON[d[2].toLowerCase()])tgl=d[1].padStart(2,"0")+"/"+String(MON[d[2].toLowerCase()]).padStart(2,"0")+"/"+d[3];
  const np=t.match(/Nomor\.?\s*Polisi\s*:?\s*([A-Z]{1,2}\s?\d{1,4}(?:\s?[A-Z]{1,3})?)(?![a-z])/);
  const bk=t.match(/Bengkel\s*:\s*(.+?)\s+Alamat\s*:/);
  const orr=t.match(/Rp\.?\s*([\d.,]+)\s*[Xx]\s*(\d+)\s*=\s*Rp\.?\s*([\d.,]+)/);
  const nk=t.match(/Nomor Klaim\.?\s*:?\s*(\d{8,})/);
  return{tgl,nopol:np?fmtPlate(np[1].replace(/\s+/g,"")):"",bengkel:bk?bk[1].trim():"",panel:orr?orr[2]:"",or:orr?num(orr[3]):"",klaim:nk?nk[1]:""};
}
async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const c=await (await pdf.getPage(p)).getTextContent();
    const it=c.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5]}));
    it.sort((a,b)=>b.y-a.y||a.x-b.x);
    let line=[],ly=0;
    const flush=()=>{if(line.length){line.sort((a,b)=>a.x-b.x);out.push(line.map(t=>t.s).join(" "))}line=[]};
    for(const t of it){if(line.length&&Math.abs(t.y-ly)>3)flush();if(!line.length)ly=t.y;line.push(t)}
    flush();
  }
  return out.join("\n");
}
// ingatan singkatan bengkel (nama lengkap -> nama singkat), disimpan di browser
function getAlias(){try{return JSON.parse(localStorage.getItem("spk_alias")||"{}")}catch(e){return{}}}
function setAlias(k,v){try{const a=getAlias();if(v&&v!==k)a[k]=v;else delete a[k];localStorage.setItem("spk_alias",JSON.stringify(a))}catch(e){}}

const KEYS=["tgl","nopol","bengkel","panel","or","klaim"];
function addRow(r){
  const tr=document.createElement("tr");
  const alias=getAlias()[r.bengkel]||r.bengkel;
  tr.innerHTML=KEYS.map(k=>`<td><input data-k="${k}"></td>`).join("")+`<td><button title="Hapus baris">×</button></td>`;
  const ins=tr.querySelectorAll("input");
  KEYS.forEach((k,i)=>{ins[i].value=k=="bengkel"?alias:r[k];if(!ins[i].value)ins[i].classList.add("m")});
  ins[2].dataset.full=r.bengkel;
  tr.addEventListener("input",e=>{e.target.classList.toggle("m",!e.target.value)});
  ins[2].addEventListener("change",e=>{if(e.target.dataset.full)setAlias(e.target.dataset.full,e.target.value.trim())});
  tr.querySelector("button").onclick=()=>{tr.remove();upd()};
  tb.appendChild(tr);upd();
}
function upd(){$("emp").style.display=tb.children.length?"none":"block"}
function rowsTSV(h){
  const L=[...tb.children].map(tr=>[...tr.querySelectorAll("input")].map(i=>i.value.trim()).join("\t"));
  if(h)L.unshift(["Tanggal SPK","Nomor Polisi","Bengkel","Jumlah Panel","Total OR","No Claim"].join("\t"));
  return L.join("\n");
}
function copy(btn,txt){
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}).finally(()=>{const o=btn.textContent;btn.textContent="Tersalin";setTimeout(()=>btn.textContent=o,1200)});
}
$("cpy").onclick=e=>copy(e.target,rowsTSV(false));
$("cph").onclick=e=>copy(e.target,rowsTSV(true));
$("clr").onclick=()=>{tb.innerHTML="";$("msg").innerHTML="";$("raw").value="";$("dt").hidden=true;fi.value="";upd()};
async function run(files){
  for(const f of files){
    try{
      const raw=await readPdf(f);
      const r=parse(raw);
      addRow(r);
      $("raw").value+=(($("raw").value?"\n\n":"")+"=== "+f.name+" ===\n"+raw);$("dt").hidden=false;
      if(!r.klaim&&!r.nopol)$("msg").insertAdjacentHTML("beforeend",`<div class="w">${f.name.replace(/</g,"&lt;")}: data tidak terbaca. Cek apakah formatnya SPK ACA.</div>`);
    }catch(e){$("msg").insertAdjacentHTML("beforeend",`<div class="w">${f.name.replace(/</g,"&lt;")}: gagal dibaca (${e.message})</div>`)}
  }
  fi.value="";
}
</script>
</body>
</html>
